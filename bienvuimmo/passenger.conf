# Configuration Passenger pour o2switch

# Version de Node.js à utiliser (vérifier la version disponible sur votre serveur)
PassengerNodejs /usr/bin/node

# Racine de l'application
PassengerAppRoot /home/VOTRE_USERNAME/public_html

# Type d'application
PassengerAppType node

# Fichier de démarrage
PassengerStartupFile server.js

# Activer Passenger
PassengerEnabled on

# Environnement (production)
PassengerAppEnv production

# Nombre maximum d'instances
PassengerMaxPoolSize 6

# Temps minimum avant inactivité
PassengerMinInstances 1

# Démarrage automatique
PassengerPreStart https://bienvuimmo.fr/

# Log
PassengerLogLevel 3
PassengerDebugLogFile /home/VOTRE_USERNAME/logs/passenger.log
