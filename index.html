<!doctype html>
<html lang="fr">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>bienvuimmo.fr</title>
    <style>
      * { box-sizing: border-box; margin: 0; padding: 0; }
      body {
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
        min-height: 100vh;
        display: grid;
        place-items: center;
        background: linear-gradient(135deg, #0f172a 0%, #1e293b 100%);
        color: #e2e8f0;
        padding: 2rem;
      }
      main {
        max-width: 640px;
        text-align: center;
      }
      h1 {
        font-size: clamp(2rem, 8vw, 4rem);
        margin-bottom: 1rem;
        background: linear-gradient(90deg, #38bdf8, #818cf8);
        -webkit-background-clip: text;
        background-clip: text;
        color: transparent;
      }
      p { color: #94a3b8; font-size: 1.125rem; line-height: 1.6; }
      .badge {
        display: inline-flex;
        align-items: center;
        gap: 0.5rem;
        margin-top: 2rem;
        padding: 0.5rem 1rem;
        background: rgba(56, 189, 248, 0.1);
        border: 1px solid rgba(56, 189, 248, 0.3);
        border-radius: 999px;
        color: #7dd3fc;
        font-size: 0.875rem;
        font-family: ui-monospace, monospace;
      }
      .dot {
        width: 8px;
        height: 8px;
        background: #34d399;
        border-radius: 50%;
        animation: pulse 2s infinite;
      }
      @keyframes pulse {
        0%, 100% { opacity: 1; }
        50% { opacity: 0.4; }
      }
    </style>
  </head>
  <body>
    <main>
      <h1>bienvuimmo.fr</h1>
      <p>Site en cours de construction. Reviens bientôt.</p>
      <div class="badge">
        <span class="dot"></span>
        Hébergé sur HippoSaaS
      </div>
    </main>
  </body>
</html>
